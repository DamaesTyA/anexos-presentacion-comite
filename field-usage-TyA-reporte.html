<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Usage Analysis — TyA Construcción</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────── */
:root {
  /* Colores base */
  --bg:          #F5F6F8;
  --surface:     #FFFFFF;
  --border:      #E4E7EC;
  --border-soft: #EEF0F4;

  /* Texto — 3 roles */
  --text-primary:   #111827;
  --text-secondary: #6B7280;
  --text-tertiary:  #9CA3AF;

  /* Marca */
  --brand:       #0062FF;
  --brand-light: #EEF4FF;
  --brand-muted: rgba(0,98,255,.12);
  --accent:      #7C5CFF;

  /* Estado */
  --red:    #DC2626;
  --orange: #EA580C;
  --green:  #16A34A;

  /* Tipografía — escala fija para UI denso */
  --font:       'Inter', 'DM Sans', -apple-system, sans-serif;
  --text-xs:    0.6875rem;  /* 11px */
  --text-sm:    0.75rem;    /* 12px */
  --text-base:  0.8125rem;  /* 13px */
  --text-md:    0.9375rem;  /* 15px */
  --text-xl:    1.5rem;     /* 24px */
  --text-2xl:   1.75rem;    /* 28px */

  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;

  /* Radios y espacios */
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --space-xs:  6px;
  --space-md:  16px;
  --space-lg:  24px;
}

/* ── Reset ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body {
  font-family: var(--font);
  font-size: var(--text-base);
  font-weight: var(--weight-regular);
  line-height: 1.5;
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* ── Header ──────────────────────────────────────────── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--space-md) 40px;
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  flex-wrap: wrap;
}
.header-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header h1 {
  font-size: var(--text-xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.3px;
  color: var(--text-primary);
  line-height: 1.2;
}
.header-sub {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--brand);
  margin-top: 2px;
}
.header-brand {
  text-align: right;
  font-size: var(--text-sm);
}
.header-brand strong {
  font-weight: var(--weight-bold);
  color: var(--accent);
  font-size: var(--text-base);
}
.header-brand span {
  display: block;
  color: var(--text-tertiary);
  font-size: var(--text-xs);
  margin-top: 2px;
}

/* ── Layout ──────────────────────────────────────────── */
.main { max-width: 1100px; margin: 0 auto; padding: var(--space-lg) var(--space-lg) 48px }

/* ── KPIs ────────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--space-xs);
  margin-bottom: var(--space-md);
}
@media(max-width:800px) { .kpi-grid { grid-template-columns: repeat(3,1fr) } }
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md) var(--space-md) 12px;
}
.kpi-val {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  line-height: 1;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}
.kpi-label {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  margin-top: var(--space-xs);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* ── Chart ───────────────────────────────────────────── */
.chart-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: var(--space-md);
  display: flex;
  align-items: center;
  gap: 28px;
  flex-wrap: wrap;
}
.chart-title {
  font-size: var(--text-base);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  margin-bottom: 10px;
}
.legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px }
.legend-item { display: flex; align-items: center; gap: 8px }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0 }
.legend-count {
  font-size: var(--text-base);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  min-width: 32px;
}
.legend-name { font-size: var(--text-sm); color: var(--text-secondary); flex: 1 }
.legend-pct { font-size: var(--text-sm); color: var(--text-tertiary); font-variant-numeric: tabular-nums }

/* ── Controles ───────────────────────────────────────── */
.controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  margin-bottom: var(--space-md);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.ctrl-label {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 2px;
}
.sort-btn {
  padding: 4px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg);
  font-family: var(--font);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
  white-space: nowrap;
  line-height: 1.6;
}
.sort-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light) }
.sort-btn.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
  font-weight: var(--weight-semibold);
}
.sort-dir {
  padding: 4px 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg);
  font-family: var(--font);
  font-size: var(--text-base);
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color .15s, color .15s;
  line-height: 1.6;
}
.sort-dir:hover { border-color: var(--brand); color: var(--brand) }
.search-box {
  padding: 4px 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: var(--font);
  font-size: var(--text-sm);
  color: var(--text-primary);
  width: 180px;
  outline: none;
  transition: border-color .15s;
}
.search-box::placeholder { color: var(--text-tertiary) }
.search-box:focus { border-color: var(--brand) }
.sep { color: var(--border); font-size: 18px; user-select: none }

/* ── Cards ───────────────────────────────────────────── */
.obj-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.obj-card:hover { border-color: var(--brand); box-shadow: 0 2px 8px rgba(0,98,255,.07) }

.card-header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid var(--border-soft);
}
.card-name {
  font-size: var(--text-md);
  font-weight: var(--weight-semibold);
  color: var(--text-primary);
}
.card-tag {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.card-meta {
  font-size: var(--text-sm);
  color: var(--text-tertiary);
}
.card-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.card-estado {
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
}
.card-pct {
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  font-variant-numeric: tabular-nums;
}

/* ── Barra ───────────────────────────────────────────── */
.bar-wrap {
  height: 4px;
  background: var(--border-soft);
  display: flex;
  overflow: hidden;
}
.bar-wrap > div { height: 100% }

/* ── Badges ──────────────────────────────────────────── */
.badges { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 18px }
.badge {
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  font-family: var(--font);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: #fff;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ── Detalle ─────────────────────────────────────────── */
details summary {
  padding: 7px 18px;
  cursor: pointer;
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--brand);
  list-style: none;
  user-select: none;
  border-top: 1px solid var(--border-soft);
}
details summary::-webkit-details-marker { display: none }
details[open] summary { color: #0044CC }

/* ── Tabla ───────────────────────────────────────────── */
.campos-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font);
  font-size: var(--text-sm);
}
.campos-table th {
  padding: 7px 14px;
  text-align: left;
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.campos-table td {
  padding: 7px 14px;
  border-bottom: 1px solid var(--border-soft);
  font-size: var(--text-sm);
  font-weight: var(--weight-regular);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.campos-table tr:last-child td { border-bottom: none }
.campos-table tr:hover td { background: var(--brand-light) }
.td-api { color: var(--text-secondary) !important; font-size: var(--text-xs) !important }
.td-tipo { color: var(--text-tertiary) !important }
.td-nivel { text-align: center; font-weight: var(--weight-semibold) !important }
.td-uso { text-align: right; font-weight: var(--weight-bold) !important; font-variant-numeric: tabular-nums }

.no-results {
  text-align: center;
  padding: 48px;
  color: var(--text-tertiary);
  font-size: var(--text-base);
}
</style>
</head>

  <div class="header-inner">

let sortKey = 'pct_nunca';
let sortAsc  = false;
let search   = '';
let tipoFiltro = 'todos';

const ctx = document.getElementById('donutChart').getContext('2d');
new Chart(ctx, {
  type: 'doughnut',
  data: {
    labels: ["Nunca Usado", "Muy Poco Uso", "Poco Uso", "Uso Moderado", "Uso Frecuente", "Uso Intensivo"],
    datasets: [{ data: [2172, 172, 148, 87, 57, 1305], backgroundColor: ["#ef4444", "#f97316", "#eab308", "#3b82f6", "#22c55e", "#16a34a"], borderWidth: 2, borderColor: '#fff' }]
  },
  options: {
    cutout: '72%',
    plugins: { legend: {display:false}, tooltip: {callbacks: { label: c => ' ' + c.label + ': ' + c.parsed }} },
    animation: { duration: 600 }
  }
});

const nivelesCounts = [2172, 172, 148, 87, 57, 1305];
const leg = document.getElementById('legendItems');
NIVELES.forEach((n, i) => {
  const pct = Math.round(nivelesCounts[i] / 3941 * 100);
  leg.innerHTML += `<div class="legend-item">
    <div class="legend-dot" style="background:${COLORES[n]}"></div>
    <span class="legend-count">${nivelesCounts[i]}</span>
    <span class="legend-name">${n}</span>
    <span class="legend-pct">${pct}%</span>
  </div>`;
});

function badge(n, count) {
  if (!count) return '';
  return `<span class="badge" style="background:${COLORES[n]}">${count} ${n}</span>`;
}

function borderColor(s) {
  if (s.pct_nunca === 100) return 'var(--red)';
  if (s.pct_nunca >= 50)   return 'var(--orange)';
  return 'var(--green)';
}

function estadoLabel(s) {
  if (s.pct_nunca === 100) return '<span class="card-estado" style="color:var(--red)">Sin uso</span>';
  if (s.pct_nunca >= 50)   return '<span class="card-estado" style="color:var(--orange)">Uso bajo</span>';
  return '<span class="card-estado" style="color:var(--green)">En uso</span>';
}

function renderCard(s) {
  const tagBg    = s.es_custom ? 'var(--brand-muted)' : s.es_standard ? 'rgba(124,92,255,.1)' : 'rgba(0,0,0,.05)';
  const tagColor = s.es_custom ? 'var(--brand)' : s.es_standard ? 'var(--accent)' : 'var(--text-tertiary)';
  const tagLabel = s.es_custom ? 'CUSTOM' : s.es_standard ? 'ESTÁNDAR' : 'SISTEMA';
  const border   = borderColor(s);

  const barSegments = Object.entries({'Nunca Usado':'nunca','Muy Poco Uso':'muy_poco','Poco Uso':'poco',
    'Uso Moderado':'moderado','Uso Frecuente':'frecuente','Uso Intensivo':'intensivo'})
    .map(([n,k]) => {
      const c = s[k]; if (!c) return '';
      return `<div style="width:${(c/s.total*100).toFixed(1)}%;background:${COLORES[n]}" title="${n}: ${c}"></div>`;
    }).join('');

  const camposRows = s.campos.map(c => {
    const col = COLORES[c.nivel] || 'var(--text-secondary)';
    return `<tr>
      <td class="td-api">${c.api}</td>
      <td>${c.label}</td>
      <td class="td-tipo">${c.tipo}</td>
      <td class="td-nivel" style="color:${col}">${c.nivel}</td>
      <td class="td-uso" style="color:${col}">${c.pct.toFixed(1)}%</td>
    </tr>`;
  }).join('');

  return `<div class="obj-card" style="border-left:3px solid ${border}">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="card-name">${s.nombre}</span>
        <span class="card-tag" style="background:${tagBg};color:${tagColor}">${tagLabel}</span>
        <span class="card-meta">${s.registros.toLocaleString()} registros · ${s.total} campos</span>
      </div>
      <div class="card-right">
        ${estadoLabel(s)}
        <span class="card-pct" style="color:${border}">${s.pct_nunca}%</span>
      </div>
    </div>
    <div class="bar-wrap">${barSegments}</div>
    <div class="badges">
      ${badge('Nunca Usado',s.nunca)}
      ${badge('Muy Poco Uso',s.muy_poco)}
      ${badge('Poco Uso',s.poco)}
      ${badge('Uso Moderado',s.moderado)}
      ${badge('Uso Frecuente',s.frecuente)}
      ${badge('Uso Intensivo',s.intensivo)}
    </div>
    <details>
      <summary>Ver campos (${s.total})</summary>
      <div style="overflow-x:auto">
        <table class="campos-table">
          <thead><tr>
            <th>API Name</th><th>Label</th><th>Tipo</th>
            <th style="text-align:center">Nivel</th>
            <th style="text-align:right">Uso</th>
          </tr></thead>
          <tbody>${camposRows}</tbody>
        </table>
      </div>
    </details>
  </div>`;
}

function render() {
  let data = DATA.filter(s => {
    if(tipoFiltro==='custom'  && !s.es_custom)                  return false;
    if(tipoFiltro==='std'     && !s.es_standard)                return false;
    if(tipoFiltro==='sistema' && (s.es_custom || s.es_standard)) return false;
    if(search && !s.nombre.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  data.sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if(typeof va==='string') va=va.toLowerCase(), vb=vb.toLowerCase();
    if(va < vb) return sortAsc ? -1 : 1;
    if(va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  const container = document.getElementById('cards-container');
  const noResults = document.getElementById('no-results');
  if(data.length===0) {
    container.innerHTML = '';
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    container.innerHTML = data.map(renderCard).join('');
  }
}

function setTipo(tipo, btn) {
  tipoFiltro = tipo;
  document.querySelectorAll('#tipo-todos,#tipo-custom,#tipo-std,#tipo-sistema').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setSort(key, btn) {
  if(sortKey===key) { sortAsc=!sortAsc; }
  else { sortKey=key; sortAsc=(key==='nombre'); }
  document.querySelectorAll('#sort-pct_nunca,#sort-nombre,#sort-nunca,#sort-total,#sort-registros').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateDirBtn();
  render();
}

function toggleDir() {
  sortAsc=!sortAsc;
  updateDirBtn();
  render();
}

function updateDirBtn() {
  document.getElementById('dirBtn').textContent = sortAsc ? '↑' : '↓';
}

function setSearch(val) {
  search=val;
  render();
}

render();
</script>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f7f7f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.hint{font-size:13px;color:#888;margin-bottom:12px;text-align:center}.hint b{color:#2F5496}
.diagram-wrap{max-width:1100px;width:100%;background:#fff;border-radius:14px;border:1px solid #e5e5e0;box-shadow:0 4px 24px rgba(0,0,0,0.06);padding:16px;overflow:auto}
.diagram-wrap svg{width:100%;height:auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,17,23,0.5);backdrop-filter:blur(5px);z-index:100;justify-content:center;align-items:flex-start;padding:40px 24px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,0.2);animation:mIn 0.2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.mh{padding:24px 28px 16px;border-bottom:1px solid #eee;position:relative}
.mh h2{font-size:19px;font-weight:700;color:#1a1a1a;letter-spacing:-0.3px;padding-right:40px}
.mh .dsid{font-size:11px;color:#999;font-family:'JetBrains Mono',monospace;margin-top:4px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px;margin-top:6px}
.b-op{background:#e6f9f0;color:#0f6e56}.b-prop{background:#e6f0fb;color:#2f5496}.b-neg{background:#fbeaf0;color:#993556}
.cbtn{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:7px;border:1px solid #eee;background:#fafafa;cursor:pointer;font-size:16px;color:#999;display:flex;align-items:center;justify-content:center}.cbtn:hover{background:#eee;color:#333}
.mb{padding:20px 28px 28px}
.sec{margin-bottom:16px}.sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;margin-bottom:5px}.sv{font-size:13px;color:#555;line-height:1.6}.sv strong{color:#333;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;background:#f7f7f5;border:1px solid #eee;border-radius:7px;padding:10px 14px;color:#666;word-break:break-all;white-space:pre-wrap;line-height:1.5}
hr.d{border:none;border-top:1px solid #eee;margin:18px 0}
.vpill{display:inline-flex;align-items:center;gap:5px;background:#e6f0fb;color:#2f5496;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;margin-right:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vars-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:#f7f7f5;border:1px solid #e5e5e0;border-radius:8px;cursor:pointer;font:500 13px 'DM Sans',sans-serif;color:#2f5496;transition:all 0.15s;margin-top:4px}
.vars-btn:hover{background:#eef3fb;border-color:#c5d5ef}
.vars-btn .arrow{transition:transform 0.2s}.vars-btn.open .arrow{transform:rotate(90deg)}
.vars-table{display:none;margin-top:8px;border:1px solid #eee;border-radius:8px;overflow:hidden;max-height:400px;overflow-y:auto}
.vars-table.show{display:block}
.vars-table table{width:100%;border-collapse:collapse;font-size:11px}
.vars-table th{background:#f7f7f5;padding:8px 10px;text-align:left;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;font-size:10px;position:sticky;top:0}
.vars-table td{padding:6px 10px;border-top:1px solid #f0f0f0;color:#555}.vars-table tr:hover td{background:#fafafa}
@media(max-width:700px){.g2{grid-template-columns:1fr}}

function openModal(k) {
  const d=D[k];if(!d)return;
  const bc=d.badge==='op'?'b-op':d.badge==='neg'?'b-neg':'b-prop';
  let allVars=[];
  (d.varKeys||[]).forEach(dk=>{if(VARS[dk])allVars=allVars.concat(VARS[dk])});
  const vrows=allVars.map((v,i)=>`<tr><td style="color:#999;font-family:monospace">${i+1}</td><td style="font-weight:500;color:#333">${v.n}</td><td>${v.d}</td></tr>`).join('');
  document.getElementById('md').innerHTML=`
    <div class="mh">
      <button class="cbtn" onclick="closeModal()">✕</button>
      <h2>${d.name}</h2>
      <div class="dsid">${d.id} · ${d.sub}</div>
      <div><span class="vpill">◆ ${d.vars} variables</span><span class="badge ${bc}">${d.estado}</span></div>
    </div>
    <div class="mb">
      <div class="sec"><div class="sl">Descripción</div><div class="sv">${d.desc}</div></div>
      <div class="g2">
        <div class="sec"><div class="sl">Método de extracción</div><div class="sv"><strong>${d.method}</strong><br>${d.methodDetail}</div></div>
        <div class="sec"><div class="sl">Formato / Frecuencia</div><div class="sv"><strong>${d.formato}</strong><br>${d.freq}</div></div>
      </div>
      <div class="sec"><div class="sl">Endpoint / URL</div><div class="mono">${d.endpoint}</div></div>
      <div class="sec"><div class="sl">Autenticación</div><div class="sv">${d.auth}</div></div>
      <hr class="d">
      <div class="sec"><div class="sl">Propuesta de pipeline</div><div class="sv">${d.proposal}</div></div>
      <div class="sec"><div class="sl">Consideraciones</div><div class="sv">${d.consideraciones}</div></div>
      <div class="g2">
        <div class="sec"><div class="sl">Contacto</div><div class="sv">${d.contacto}</div></div>
        <div class="sec"><div class="sl">Dependencias</div><div class="sv">${d.dependencias}</div></div>
      </div>
      ${allVars.length?`<hr class="d">
      <div class="sec">
        <button class="vars-btn" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')">
          <span class="arrow">▶</span> Ver ${allVars.length} variables del catálogo
        </button>
        <div class="vars-table">
          <table><thead><tr><th>#</th><th>Variable</th><th>Descripción</th></tr></thead><tbody>${vrows}</tbody></table>
        </div>
      </div>`:''}
    </div>`;
  document.getElementById('ov').classList.add('open');
}
function closeModal(){document.getElementById('ov').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
